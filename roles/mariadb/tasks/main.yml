---
- name: Configuracion personalizada de MariaDB
  ansible.builtin.template:
    src: 99-custom.cnf.j2
    dest: /etc/my.cnf.d/99-custom.cnf
    mode: "0644"
  notify: Reiniciar mariadb

- name: Desactivar SSL por defecto para el cliente de MariaDB
  ansible.builtin.copy:
    dest: /etc/my.cnf.d/skip_ssl.cnf
    mode: "0644"
    content: |
      [client]
      ssl=0

- name: Habilitar e iniciar mariadb
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Inicializar directorio de datos de MariaDB si no existe
  ansible.builtin.command:
    cmd: mariadb-install-db --user=mysql --datadir=/var/lib/mysql
    creates: /var/lib/mysql/mysql

- name: Aplicar cambios pendientes
  ansible.builtin.meta: flush_handlers

- name: Asegurar MariaDB y crear base de datos y usuario
  ansible.builtin.command: mariadb -u root 
  args:
    stdin: |
      DROP USER IF EXISTS ''@'localhost';
      DROP DATABASE IF EXISTS test;
      CREATE DATABASE IF NOT EXISTS `{{ mariadb_app_db }}` CHARACTER SET utf8mb4;
      CREATE USER IF NOT EXISTS '{{ mariadb_app_user }}'@'localhost'
        IDENTIFIED BY '{{ mariadb_app_password }}';
      ALTER USER '{{ mariadb_app_user }}'@'localhost'
        IDENTIFIED BY '{{ mariadb_app_password }}';
      GRANT ALL PRIVILEGES ON `{{ mariadb_app_db }}`.*
        TO '{{ mariadb_app_user }}'@'localhost';
      ALTER USER 'root'@'localhost' IDENTIFIED VIA unix_socket
        OR mysql_native_password USING PASSWORD('{{ mariadb_root_password }}');
      FLUSH PRIVILEGES;
  changed_when: false
  no_log: false
