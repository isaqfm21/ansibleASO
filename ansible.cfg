[defaults]
inventory = /root/ansibleASO/inventory/hosts
roles_path = roles
vault_password_file = /root/ansibleASO/.vault_pass
interpreter_python = auto_silent
host_key_checking = False
forks = 20
strategy = free
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /root/.ansible/fact_cache
fact_caching_timeout = 3600
callbacks_enabled = timer

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
